<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Water treatment and renewable energy systems monitored by AI forecasting">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f6fb"/>
      <stop offset="1" stop-color="#ece9f4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa7e0"/>
      <stop offset="1" stop-color="#3f6fb3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <line x1="0" y1="292" x2="640" y2="292" stroke="#d9d6e4" stroke-width="2"/>

  <!-- wind turbine -->
  <g stroke="#461D7C" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="92" y1="292" x2="92" y2="130"/>
    <g transform="translate(92 130)">
      <line x1="0" y1="0" x2="0" y2="-62"/>
      <line x1="0" y1="0" x2="54" y2="31"/>
      <line x1="0" y1="0" x2="-54" y2="31"/>
    </g>
  </g>
  <circle cx="92" cy="130" r="8" fill="#FDD023"/>

  <!-- solar panels -->
  <g fill="#461D7C">
    <path d="M150 262 l40 -26 h56 l-40 26 z"/>
    <path d="M214 262 l40 -26 h56 l-40 26 z"/>
  </g>
  <g stroke="#FDD023" stroke-width="1.6">
    <line x1="170" y1="249" x2="226" y2="249"/><line x1="234" y1="249" x2="290" y2="249"/>
  </g>
  <line x1="196" y1="262" x2="196" y2="292" stroke="#461D7C" stroke-width="4"/>
  <line x1="260" y1="262" x2="260" y2="292" stroke="#461D7C" stroke-width="4"/>

  <!-- treatment tanks -->
  <g>
    <rect x="352" y="206" width="104" height="86" rx="6" fill="#ffffff" stroke="#461D7C" stroke-width="4"/>
    <rect x="356" y="236" width="96" height="52" fill="url(#water)"/>
    <path d="M356 236 q12 -7 24 0 t24 0 t24 0 t24 0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="480" y="226" width="86" height="66" rx="6" fill="#ffffff" stroke="#461D7C" stroke-width="4"/>
    <rect x="484" y="250" width="78" height="38" fill="url(#water)"/>
    <path d="M484 250 q10 -6 19.5 0 t19.5 0 t19.5 0 t19.5 0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M456 250 h24" stroke="#461D7C" stroke-width="5"/>
  </g>

  <!-- forecast panel -->
  <g>
    <rect x="352" y="40" width="214" height="128" rx="10" fill="#2e1252"/>
    <line x1="372" y1="140" x2="546" y2="140" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
    <polyline points="372,126 398,112 420,118 444,96 466,102" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="466,102 490,84 516,90 546,66" fill="none" stroke="#FDD023" stroke-width="3" stroke-dasharray="7 6" stroke-linejoin="round"/>
    <circle cx="466" cy="102" r="5" fill="#FDD023"/>
    <text x="372" y="64" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">AI forecast</text>
    <line x1="459" y1="168" x2="459" y2="206" stroke="#461D7C" stroke-width="3" stroke-dasharray="5 5"/>
  </g>

  <!-- data links from the energy assets into the model -->
  <path d="M100 116 C 180 40, 280 60, 352 92" fill="none" stroke="#a06a00" stroke-width="2.5" stroke-dasharray="6 7"/>
  <path d="M240 236 C 280 190, 310 150, 352 140" fill="none" stroke="#a06a00" stroke-width="2.5" stroke-dasharray="6 7"/>
</svg>
